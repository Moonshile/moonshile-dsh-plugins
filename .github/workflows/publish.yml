name: publish

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Publish unpublished plugin versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Create a publish-scoped access token at https://www.npmjs.com/settings/<user>/tokens and add it as a repository secret named NPM_TOKEN."
            exit 1
          fi
          npm config set "//registry.npmjs.org/:_authToken" "$NODE_AUTH_TOKEN"
          published=0
          for pkg in plugins/*/package.json; do
            name=$(node -p "require('./$pkg').name")
            ver=$(node -p "require('./$pkg').version")
            if [ -z "$name" ] || [ "$name" = "null" ]; then
              continue
            fi
            if npm view "$name" versions --json 2>/dev/null | grep -q "\"$ver\""; then
              echo "skip  $name@$ver (already on npm)"
            else
              echo ">>>   $name@$ver not on npm, publishing"
              pnpm --filter "$name" publish --access public --no-git-checks
              published=$((published + 1))
            fi
          done
          echo "published=$published plugins"
